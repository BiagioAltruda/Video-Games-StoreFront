<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Il tuo CSS -->
    <link rel="stylesheet" href="../styles/StoreFrontStyleSheet.css" />
    <title>Smoke Home - Trending</title>
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <div id="navbar"></div>
    <script src="../script/navBarScript.js"></script>

    <!-- MAIN -->
    <main class="py-4">
      <div class="container">
        <div class="row">
          <div class="col-12">

            <!-- Filtro per mese (allineato e con spazi coerenti) -->
            <div id="monthFilterBar" class="d-flex align-items-center flex-wrap gap-2 mb-3">
              <label for="trendMonth" class="form-label mb-0 me-2">
                <i class="fas fa-calendar-alt me-1"></i>Mese
              </label>
              <input type="month" id="trendMonth" class="form-control form-control-sm" style="max-width: 220px;">
              <button id="applyMonth" class="btn btn-sm btn-primary">
                <i class="fas fa-filter me-1"></i>Applica
              </button>
              <button id="clearMonth" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-undo me-1"></i>Reset
              </button>
              <span id="activeFilterBadge" class="badge text-bg-info ms-2 d-none"></span>
            </div>

            <!-- Sezione Trending Games -->
            <h2 class="mb-3 d-flex align-items-center">
              <i class="fas fa-fire me-2"></i>Trending Games
            </h2>
            <div class="row g-4" id="trendingContainer">
              <!-- Le card trending vengono generate qui via JS -->
            </div>

            <!-- Divider -->
            <hr class="my-5" />

            <!-- Sezione Top 3 Giochi più Giocati -->
            <h2 class="mb-4 text-center">
              <i class="fas fa-trophy me-2"></i>Top 3 Giochi più Giocati
            </h2>
            <div class="row g-4 justify-content-center" id="top3Container">
              <!-- Card Top 1 -->
              <div class="col-12 col-md-6 col-lg-4">
                <div class="card game-card h-100 text-center overflow-hidden">
                  <div class="ratio ratio-16x9">
                    <img src="https://via.placeholder.com/400x200" class="w-100 h-100 object-fit-cover" alt="Top 1">
                  </div>
                  <div class="card-overlay p-3">
                    <h5 class="card-title mb-1">Top 1</h5>
                    <p class="mb-1"><i class="fas fa-star me-1"></i>Primo posto</p>
                    <p class="small mb-0"><i class="fas fa-users me-1"></i>1.000.000+ giocatori</p>
                  </div>
                </div>
              </div>
              <!-- Card Top 2 -->
              <div class="col-12 col-md-6 col-lg-4">
                <div class="card game-card h-100 text-center overflow-hidden">
                  <div class="ratio ratio-16x9">
                    <img src="https://via.placeholder.com/400x200" class="w-100 h-100 object-fit-cover" alt="Top 2">
                  </div>
                  <div class="card-overlay p-3">
                    <h5 class="card-title mb-1">Top 2</h5>
                    <p class="mb-1"><i class="fas fa-star-half-alt me-1"></i>Secondo posto</p>
                    <p class="small mb-0"><i class="fas fa-users me-1"></i>750.000+ giocatori</p>
                  </div>
                </div>
              </div>
              <!-- Card Top 3 -->
              <div class="col-12 col-md-6 col-lg-4">
                <div class="card game-card h-100 text-center overflow-hidden">
                  <div class="ratio ratio-16x9">
                    <img src="https://via.placeholder.com/400x200" class="w-100 h-100 object-fit-cover" alt="Top 3">
                  </div>
                  <div class="card-overlay p-3">
                    <h5 class="card-title mb-1">Top 3</h5>
                    <p class="mb-1"><i class="fas fa-star me-1"></i>Terzo posto</p>
                    <p class="small mb-0"><i class="fas fa-users me-1"></i>500.000+ giocatori</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Divider -->
            <hr class="my-5" />

            <!-- Sezione Tutti i Giochi Trend -->
            <h2 class="mb-4 text-center">
              <i class="fas fa-gamepad me-2"></i>Tutti i Giochi Trend
            </h2>
            <div class="row g-4" id="allGamesContainer">
              <!-- Tutti i giochi trend vengono caricati qui via JS -->
            </div>

          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
    <script src="../script/footerScript.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script -->
    <script src="../script/RegisterScript.js"></script>
    <script src="../script/TrendingScript.js"></script>
  </body>
</html>
