<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- Font Awesome (icone) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../styles/StoreFrontStyleSheetCatalogo.css" />
    <title>Smoke Catalogo</title>
  </head>
  <body>
    <!-- Navbar -->
    <div id="navbar"></div>
    <script src="../script/navBarScript.js"></script>


    <!-- Container principale con menu laterale e card -->
    <div class="container-fluid mt-3">
      <div class="row">
        <!-- Menu laterale -->
        <div class="col-md-3">
          <div class="sidebar-menu main-color-1 p-4 ms-3 rounded" style="margin-left: 20px !important">
            <h5 class="text-white mb-4">MENU</h5>

            <!-- Cerca per nome -->
            <div class="mb-4">
              <h6 class="text-white mb-2">CERCA PER NOME</h6>
              <form class="search-form">
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Inserisci nome..."
                    aria-label="Cerca per nome"
                  />
                  <button class="btn btn-light" type="submit">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </form>
            </div>

            <!-- Cerca per categoria -->
<div class="mb-3">
    <h6 class="text-white mb-2">CERCA PER CATEGORIA</h6>
    <div class="categorie-menu">
        <div class="categoria-item" onclick="mostraTuttiIGiochi()">
            <i class="fas fa-star me-2"></i>TUTTE LE CATEGORIE
        </div>
        <div class="categoria-item" onclick="cercaCategoria('ACTION')">
            <i class="fas fa-fist-raised me-2"></i>ACTION
        </div>
        <div class="categoria-item" onclick="cercaCategoria('ADVENTURE')">
            <i class="fas fa-mountain me-2"></i>ADVENTURE
        </div>
        <div class="categoria-item" onclick="cercaCategoria('CASUAL')">
            <i class="fas fa-gamepad me-2"></i>CASUAL
        </div>
        <div class="categoria-item" onclick="cercaCategoria('FREE TO PLAY')">
            <i class="fas fa-coins me-2"></i>FREE TO PLAY
        </div>
        <div class="categoria-item" onclick="cercaCategoria('INDIE')">
            <i class="fas fa-leaf me-2"></i>INDIE
        </div>
        <div class="categoria-item" onclick="cercaCategoria('MASSIVELY MULTIPLAYER')">
            <i class="fas fa-users me-2"></i>MULTIPLAYER
        </div>
        <div class="categoria-item" onclick="cercaCategoria('RPG')">
            <i class="fas fa-dragon me-2"></i>RPG
        </div>
        <div class="categoria-item" onclick="cercaCategoria('SPORTS')">
            <i class="fas fa-running me-2"></i>SPORTS
        </div>
        <div class="categoria-item" onclick="cercaCategoria('STRATEGY')">
            <i class="fas fa-chess me-2"></i>STRATEGY
        </div>
    </div>
</div>
          </div>
        </div>

        <!-- Container delle Card (AFFIANCATO al menu) -->
        <div class="col-md-9">
          <div id="cards-container" class="row">
            <!-- Le card verranno generate qui automaticamente dal database -->
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>
    <script src="../script/footerScript.js"></script>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/ScriptCatalogo.js"></script>
    <script src="../script/RegisterScript.js"></script>
  </body>
</html>
