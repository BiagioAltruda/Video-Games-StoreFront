<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Payment Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- CSS del progetto -->
  <link rel="stylesheet" href="../styles/StoreFrontStyleSheetPayment.css" />

  <style>
    .card-shadow { box-shadow: 0 10px 25px rgba(0,0,0,.08); border-radius: 14px; }
    .cc-input { letter-spacing: .1rem; }
  </style>
</head>
<body class="bg-light">

 <!-- Navbar -->

 <div id="navbar"></div>
 <script src="../script/navBarScript.js"></script>

  <div class="container my-4">
    <!-- Contenitore messaggi (success/error) -->
    <div id="alerts"></div>

    <div id="transactionForm" class="row g-4">
      <script>

        const transaction = JSON.parse(localStorage.getItem("data"));

        transaction.date = new Date().toLocaleDateString('en-US');

        document.getElementById("transactionForm").innerHTML = `
        <!-- Transaction Form -->
      <div class="col-lg-6">
        <div class="card card-shadow">
          <div class="card-header bg-white">
            <h5 class="mb-0"><i class="fa-solid fa-receipt me-2"></i>Transaction Details</h5>
          </div>
          <div class="card-body">
            <form id="transactionDetails">
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <label for="tx-player"><strong>Player</strong></label>
                <input type="text" id="tx-player" class="form-control form-control-sm text-muted" value="${transaction.player}" readonly disabled>
              </div>
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <label for="tx-game"><strong>Game</strong></label><input type="text" id="tx-game" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" value="${transaction.gameName}" readonly disabled>
              </div>
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <label for="tx-price"><strong>Price Paid</strong></label>
                <input type="text" id="tx-price" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" value="${transaction.pricePaid}" readonly disabled>
              </div>
              <div class="d-flex justify-content-between align-items-center py-2">

                <label for="tx-date"><strong>Date</strong></label>
                <input type="text" id="tx-date" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" value="${transaction.date}" readonly disabled>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
        `
      </script>
  </div>

     <!-- Payment Form -->
<div class="col-lg-6">
  <div class="card card-shadow">
    <div class="card-header bg-white">
      <h5 class="mb-0"><i class="fa-solid fa-credit-card me-2"></i>Payment Details</h5>
    </div>
    <div class="card-body">
      <form id="paymentForm" novalidate>
        <input type="hidden" name="transactionId" value="1">

        <div class="mb-3">
          <label class="form-label" for="cardholderName">Cardholder's Name</label>
          <input type="text" id="cardholderName" name="cardholderName" class="form-control" required />
          <div class="invalid-feedback">Inserisci il nome del titolare.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" class="form-control cc-input" 
                 inputmode="numeric" placeholder="1234 5678 9012 3456" maxlength="19" required />
          <div class="invalid-feedback">Inserisci un numero carta valido.</div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label" for="expirationDate">Expiration Date</label>
            <input type="text" id="expirationDate" name="expirationDate" class="form-control" 
                   placeholder="MM/YY" maxlength="5" required />
            <div class="invalid-feedback">Formato MM/YY.</div>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label" for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" class="form-control" 
                   inputmode="numeric" maxlength="4" placeholder="123" required />
            <div class="invalid-feedback">CVV non valido.</div>
          </div>
        </div>

        <button id="payBtn" type="submit" class="btn btn-primary w-100">
          <span class="me-2"><i class="fa-solid fa-lock"></i></span>Confirm Payment
        </button>
      </form>

      <!-- Risultato pagamento -->
      <div id="paymentResult" class="mt-3"></div>
    </div>
  </div>
</div>
  </div>



    <!-- row -->
  <!-- container -->

      <!-- Footer -->
 <div id="footer"></div>
 <script src="../script/footerScript.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../script/PaymentScript.js"></script>
 <script src="../script/RegisterScript.js"></script>
</body>
</html>
