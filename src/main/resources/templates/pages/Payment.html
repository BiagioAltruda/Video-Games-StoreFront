<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Payment Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- CSS del progetto -->
  <link rel="stylesheet" href="../styles/StoreFrontStyleSheet.css" />

  <style>
    .card-shadow { box-shadow: 0 10px 25px rgba(0,0,0,.08); border-radius: 14px; }
    .cc-input { letter-spacing: .1rem; }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg main-color-1 py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="home.html">
        <i class="fas fa-home me-2"></i>Payment for game
      </a>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Contenitore messaggi (success/error) -->
    <div id="alerts"></div>

    <div class="row g-4">
      <!-- Transaction Form -->
      <div class="col-lg-6">
        <div class="card card-shadow">
          <div class="card-header bg-white">
            <h5 class="mb-0"><i class="fa-solid fa-receipt me-2"></i>Transaction Details</h5>
          </div>
          <div class="card-body">
            <form id="transactionDetails">
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <strong>Transaction ID</strong>
                <input type="text" id="tx-id" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" placeholder="—">
              </div>
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <strong>Player</strong>
                <input type="text" id="tx-player" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" placeholder="—">
              </div>
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <strong>Game</strong>
                <input type="text" id="tx-game" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" placeholder="—">
              </div>
              <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                <strong>Price Paid</strong>
                <input type="text" id="tx-price" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" placeholder="—">
              </div>
              <div class="d-flex justify-content-between align-items-center py-2">
                <strong>Date</strong>
                <input type="text" id="tx-date" class="form-control form-control-sm text-muted" style="max-width: 200px; text-align: right;" placeholder="—">
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

      <!-- Payment Form -->
      <div class="col-lg-6">
        <div class="card card-shadow">
          <div class="card-header bg-white">
            <h5 class="mb-0"><i class="fa-solid fa-credit-card me-2"></i>Payment Details</h5>
          </div>
          <div class="card-body">
            <form id="paymentForm" novalidate>
              <!-- Campo nascosto con l’ID della transazione (modifica il value quando serve) -->
              <input type="hidden" name="transactionId" value="1">

              <div class="mb-3">
                <label class="form-label">Cardholder's Name</label>
                <input type="text" name="cardholderName" class="form-control" required />
                <div class="invalid-feedback">Inserisci il nome del titolare.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Card Number</label>
                <input type="text" name="cardNumber" class="form-control cc-input" inputmode="numeric"
                       placeholder="1234 5678 9012 3456" maxlength="19" required />
                <div class="invalid-feedback">Inserisci un numero carta valido.</div>
              </div>

              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label">Expiration Date</label>
                  <input type="text" name="expirationDate" class="form-control" placeholder="MM/YY" maxlength="5" required />
                  <div class="invalid-feedback">Formato MM/YY.</div>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">CVV</label>
                  <input type="text" name="cvv" class="form-control" inputmode="numeric" maxlength="4" placeholder="123" required />
                  <div class="invalid-feedback">CVV non valido.</div>
                </div>
              </div>

              <button id="payBtn" type="submit" class="btn btn-primary w-100">
                <span class="me-2"><i class="fa-solid fa-lock"></i></span>Confirm Payment
              </button>
            </form>
          </div>
        </div>
      </div>
    </div><!-- row -->
  </div><!-- container -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function () {
  "use strict";

  // ---- util ----
  function $(sel, root){ return (root||document).querySelector(sel); }
  function showAlert(type, text) {
    var wrap = $('#alerts');
    if (!wrap) { alert(text); return; }
    wrap.innerHTML =
      '<div class="alert alert-'+type+' alert-dismissible fade show" role="alert">'
      + text +
      '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>' +
      '</div>';
  }

  // Usa http://localhost:8080 se la pagina è file://, altrimenti path relativo
  var IS_HTTP = (location.protocol === 'http:' || location.protocol === 'https:');
  var BASE = IS_HTTP ? '' : 'http://localhost:8080';

  async function pay(id) {
    //disable button after pressing it
    var btn = $('#payBtn') || $('#paymentForm button[type="submit"]');
    if (btn) btn.setAttribute('disabled', 'disabled');

    try {
      //get payment data from the form
      const paymentDetails = document.getElementById('paymentForm');
      paymentDetails.addEventListener('submit', async function(event) {
        event.preventDefault();

        const transaction = document.getElementById('transactionDetails');

        const transactionDetails = new FormData(transaction);

        const playerName =document.getElementById('tx-player').value;
        const gameName = document.getElementById('tx-game').value;
        const price = document.getElementById('tx-price').value;
        const date = document.getElementById('tx-date').value;

        const transactionData = {
          "player": playerName,
          "game": gameName,
          "date": date,
          "pricePaid": price,
        };

        const data = new FormData(paymentDetails);
        const transactionId = data.get('transactionId');
        const cardholderName = data.get('cardholderName');
        const cardNumber = data.get('cardNumber');
        const expirationDate = data.get('expirationDate');
        const cvv = data.get('cvv');

        const cardData = {
          "transactionId": transactionId,
          "cardholderName": cardholderName,
          "cardNumber": cardNumber,
          "expirationDate": expirationDate,
          "cvv": cvv,
        };

        const payload = { transactionData, ...cardData};

        var res = await fetch(BASE + '/transactions/pay/' + encodeURIComponent(id), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload),
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);
        var msg = await res.text();
        showAlert('success', msg);
        var dateEl = $('#tx-date');
        if (dateEl) dateEl.textContent = new Date().toLocaleString();

      });
    } catch (e) {
      showAlert('danger', 'Errore di connessione o server non disponibile');
    } finally {
      if (btn) btn.removeAttribute('disabled');
    }
  }

  function getTransactionId() {
    var hidden = $('input[name="transactionId"]');
    if (hidden && hidden.value) return hidden.value.trim();
    var qs = new URLSearchParams(location.search).get('id');
    return qs ? qs.trim() : '';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var form = $('#paymentForm');
    if (!form) return;

    var txId = getTransactionId();
    if (!txId) { showAlert('danger', 'Manca l’ID della transazione.'); return; }

    // Se manca l'hidden lo creo
    if (!$('input[name="transactionId"]')) {
      var hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = 'transactionId';
      hidden.value = txId;
      form.appendChild(hidden);
    }

    // Dati placeholder (se vuoi quelli reali, fai una GET qui)
    var el;
    if ((el = $('#tx-id')))    el.textContent = txId;
    if ((el = $('#tx-player')))el.textContent = 'Player Name';
    if ((el = $('#tx-game')))  el.textContent = 'Game Title';
    if ((el = $('#tx-price'))) el.textContent = '—';
    if ((el = $('#tx-date')))  el.textContent = new Date().toLocaleString();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      pay(txId);
    });
  });
})();
</script>
</body>
</html>
