<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../script/authentication.js" ></script>
    <title>Smoke Home – Profilo personale</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- CSS del progetto -->
    <link rel="stylesheet" href="../styles/StoreFrontStyleSheetProfile&Admin.css" />
  </head>
  <body>

    <!-- Navbar -->

    <div id="navbar"></div>
    <script src="../script/navBarScript.js"></script>
    <div class="container mt-3">
  <div id="authOut" class="text-success fw-bold"></div>
</div>

    <!-- PROFILO -->
    <div class="container my-4">
      <!-- Header profilo -->
      <div class="d-flex align-items-center gap-3 mb-4 text-contrast">
        <div>
          <h4 class="mb-0 context-aware-text" id="profileUsername">Username</h4>
          <small class="text-muted" id="profileEmail">user@example.com</small>
        </div>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-games" type="button">Giochi</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-friends" type="button">Amici</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-password" type="button">Cambio password</button>
        </li>
      </ul>

      <div class="tab-content pt-3">
        <!-- GIOCHI (invariato) -->
        <div class="tab-pane fade show active" id="tab-games">
          <div class="card game-details-container">
            <div class="card-header bg-main">
              <h5 class="mb-0">La tua libreria</h5>
            </div>
            <div class="card-body text-contrast">
              <div id="gamesEmpty" class="text-center mb-3">
                <p class="mb-2">Nessun gioco in libreria.</p>
                <a href="../pages/Catalogo.html" class="btn btn-primary">Vai al catalogo</a>
              </div>
              <div class="row g-3" id="gamesList"></div>
            </div>
          </div>
        </div>

        <!-- AMICI -->
<div class="tab-pane fade" id="tab-friends">
  <div class="card game-details-container">
    <div class="card-header bg-main">
      <h5 class="mb-0">I tuoi amici</h5>
    </div>

    <div class="card-body text-contrast">
      <!-- Messaggi -->
      <div id="friendAlerts" class="mb-3"></div>

       <!-- tuo id (temporaneo finché non avete login) -->
      <input type="hidden" id="myUserId" value="1">


      <!-- Form: SOLO FRIEND_ID -->
      <form class="row g-2 mb-3" id="addFriendForm" novalidate>
        <div class="col-md-4">
          <label for="friendId" class="form-label mb-1">FRIEND_ID (amico)</label>
          <input
            type="number"
            class="form-control"
            id="friendId"
            placeholder="Es. 123"
            min="1"
            step="1"
            required
          />
          <div class="invalid-feedback">Inserisci un ID valido (intero &gt; 0).</div>
           <div class="form-text">Inserisci l’ID numerico del giocatore da aggiungere.</div>
        </div>
        <div class="col-auto d-flex align-items-end">
          <button type="submit" class="btn btn-primary" disabled>Aggiungi amico</button>
        </div>
      </form>
<ul class="list-group" id="friendsList"></ul>
      <div class="text-center text-muted mt-3" id="friendsEmpty">Nessun amico nella lista.</div>
      
    </div>
  </div>
</div>
       


        <!-- CAMBIO PASSWORD (invariato) -->
        <div class="tab-pane fade" id="tab-password">
          <div class="card game-details-container">
            <div class="card-header bg-main">
              <h5 class="mb-0">Cambio password</h5>
            </div>
            <div class="card-body text-contrast">
              <form class="col-12 col-md-6 col-lg-5" id="changePasswordForm">
                <div class="mb-3">
                  <label class="form-label">Password attuale</label>
                  <input type="password" class="form-control" name="currentPassword" placeholder="••••••••">
                </div>
                <div class="mb-3">
                  <label class="form-label">Nuova password</label>
                  <input type="password" class="form-control" name="newPassword" placeholder="Aggiungi nuova password">
                </div>
                <div class="mb-3">
                  <label class="form-label">Conferma nuova password</label>
                  <input type="password" class="form-control" name="confirmPassword" placeholder="Ripeti nuova password">
                </div>
                <button type="submit" class="btn btn-primary" disabled>Cambia password</button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
    

    <!-- Footer -->
    <div id="footer"></div>
    <script src="../script/footerScript.js"></script>

    <!-- JS: Amici (semplice, niente jQuery) -->
    

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
     <script src="../script/ProfileScript.js"></script>
      <script src="../script/RegisterScript.js"></script>
  </body>
</html>
