<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="../styles/StoreFrontStyle.css" />

    <title>Smoke Home - Contatti</title>
  </head>
  <body class="neutral-1">
        <!-- Navbar -->

        <div id="navbar"></div>
        <script src="../script/navBarScript.js"></script>

    <!-- Titolo pagina -->
    <header class="text-center my-5">
      <h1 class="fw-bold text-dark">
        <i class="fas fa-headset me-2"></i>Contattaci
      </h1>
      <p class="text-muted">Siamo sempre a disposizione per i gamer fumosi 🎮💨</p>
    </header>

    <!-- Contenuto -->
    <div class="container my-5">
      <div class="row">
        <!-- Info contatti -->
        <div class="col-md-6 mb-4">
          <h3 class="mb-3">📍 Dove trovarci</h3>
          <p>
            Sede centrale di Smoke Home, il paradiso dei videogiochi fumosi.<br />
            Vieni a trovarci oppure contattaci direttamente!
          </p>

          <div class="d-flex align-items-center mb-2">
            <i class="fa-solid fa-location-dot fa-lg me-2"></i>
            <span><strong>Via del Gaming 420, Milano</strong></span>
          </div>
          <div class="d-flex align-items-center mb-2">
            <i class="fa-solid fa-phone fa-lg me-2"></i>
            <span><strong>+39 02 1234 5678</strong></span>
          </div>
          <div class="d-flex align-items-center mb-4">
            <i class="fa-solid fa-envelope fa-lg me-2"></i>
            <span><strong>support@smokehome.it</strong></span>
          </div>

          <!-- Mappa Google -->
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2795.3227372993836!2d9.189982115800293!3d45.464203179101464!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4786c6aa0b4df62d%3A0xb02180c56d95a734!2sDuomo%20di%20Milano!5e0!3m2!1sit!2sit!4v1694529200000!5m2!1sit!2sit"
            width="100%"
            height="250"
            style="border:0; border-radius: 12px"
            allowfullscreen=""
            loading="lazy"
          ></iframe>
        </div>

        <!-- Form contatti -->

        <div class="col-sm-6">
          <h3>Contattaci per Info</h3>
          <form id ="contactForm">
            <div class ="row">
              <div class="col-md-6 mb-3">
                <input type="text" id ="nome" class="form-control" placeholder="Nome*" required>
              </div>
              <div class="col-md-6 mb-3">
                <input type="text" id = "cognome" class="form-control" placeholder="Cognome*" required>
              </div>
            </div>
            <div class="form-group mb-3">
              <input type="text" id ="telefono" class="form-control" placeholder="Telefono*" required>
            </div>
            <div class="form-group mb-3">
              <input type="email" id = "email" class="form-control" placeholder="Email*" required>
            </div>
            <div class="form-group mb-3">
              <textarea id = "messaggio"class="form-control" rows="4" placeholder="Il tuo messaggio*" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Invia</button>
          </form>
        </div>
        <script>
          window.addEventListener("DOMContentLoaded", function () {
            document.getElementById("contactForm").addEventListener("submit", function(e) {
              // Blocca l'invio
              e.preventDefault();

              // Prendi i valori
              let nome = document.getElementById("nome").value.trim();
              let cognome = document.getElementById("cognome").value.trim();
              let telefono = document.getElementById("telefono").value.trim();
              let email = document.getElementById("email").value.trim();
              let messaggio = document.getElementById("messaggio").value.trim();

              // Controlla che nessun campo sia vuoto
              if (!nome || !cognome || !telefono || !email || !messaggio) {
                alert("Compila tutti i campi!");
                return;
              }

              // Controllo email base
              const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
              if (!emailPattern.test(email)) {
                alert("Inserisci una email valida.");
                return;
              }

              // Controllo telefono semplice (solo numeri)
              const telPattern = /^[0-9\s+-]{6,20}$/;
              if (!telPattern.test(telefono)) {
                alert("Inserisci un numero di telefono valido.");
                return;
              }

              // Se tutto è valido, puoi procedere con l'invio (es. via AJAX o mostrare conferma)
              alert("Messaggio inviato con successo!");
              // this.submit(); ← Se vuoi davvero inviarlo a un server
            });
          });

        </script>

    <!-- Footer -->
        <div id="footer"></div>
        <script src="../script/footerScript.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/RegisterScript.js"></script>
  </body>
</html>
